services:
  mysql:
    image: mysql:8.4
    container_name: vs2-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_USER: app
      MYSQL_PASSWORD: apppw
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysql -u root -prootpw -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  redpanda:
    image: redpandadata/redpanda:v24.3.7
    container_name: vs2-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - "PLAINTEXT://0.0.0.0:9092"
      - --advertise-kafka-addr
      - "PLAINTEXT://redpanda:9092"
      - --pandaproxy-addr
      - "0.0.0.0:8082"
      - --advertise-pandaproxy-addr
      - "redpanda:8082"
    ports:
      - "9092:9092"
      - "8082:8082"

  console:
    image: redpandadata/console:v2.7.2
    container_name: vs2-redpanda-console
    environment:
      KAFKA_BROKERS: "redpanda:9092"
    ports:
      - "8088:8080"
    depends_on:
      - redpanda

  blogbackend:
    image: ghcr.io/hftm-in2023/observability_nils-krapl-blogbackend:1.0.0
    container_name: vs2-blogbackend
    environment:
      QUARKUS_PROFILE: prod
      DB_JDBC_URL: "jdbc:mysql://mysql:3306/blogdb"
      DB_USERNAME: "app"
      DB_PASSWORD: "apppw"
      KAFKA_BOOTSTRAP_SERVERS: "redpanda:9092"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redpanda:
        condition: service_started

  validator:
    image: ghcr.io/hftm-in2023/observability_nils-krapl-validator:1.0.0
    container_name: vs2-validator
    environment:
      QUARKUS_PROFILE: prod
      KAFKA_BOOTSTRAP_SERVERS: "redpanda:9092"
    ports:
      - "8081:8081"
    depends_on:
      redpanda:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - blogbackend
      - validator

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/var/lib/grafana/dashboards

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  mysql_data:
  grafana_data: